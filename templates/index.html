<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SriVarma Properties — Agent Training Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #f5a623;
    --accent2: #e8890a;
    --gold-glow: rgba(245,166,35,0.15);
    --text: #f0eeea;
    --text-dim: #8a8799;
    --user-bubble: #1e1e2e;
    --bot-bubble: #161620;
    --success: #4ade80;
    --error: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(245,166,35,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(100,80,200,0.04) 0%, transparent 50%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes bgPulse {
    0% { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.05) rotate(2deg); }
  }

  /* SETUP OVERLAY */
  #setup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    max-width: 480px;
    width: 90%;
    animation: slideUp 0.5s ease 0.1s both;
    position: relative;
    overflow: hidden;
  }

  .setup-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .setup-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .setup-logo .icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .setup-logo .brand { font-family: 'Syne', sans-serif; }
  .setup-logo .brand .main { font-size: 18px; font-weight: 700; color: var(--text); }
  .setup-logo .brand .sub { font-size: 12px; color: var(--text-dim); font-weight: 400; }

  .setup-card h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .setup-card p {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .setup-card p a {
    color: var(--accent);
    text-decoration: none;
  }

  .input-group { margin-bottom: 16px; }
  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  .input-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0a0f;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    margin-top: 8px;
  }

  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,166,35,0.3); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .setup-error {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--error);
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .header-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .status-dot {
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* LANGUAGE SELECTOR */
  .lang-selector {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .lang-btn {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #0a0a0f;
    font-weight: 700;
  }

  .reset-btn {
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* CHAT AREA */
  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }

  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-track { background: transparent; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* WELCOME */
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    animation: slideUp 0.6s ease;
  }

  .welcome-badge {
    background: var(--gold-glow);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
  }

  .welcome-screen h1 {
    font-family: 'Syne', sans-serif;
    font-size: 36px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text) 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .welcome-screen p {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 36px;
  }

  .quick-questions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 560px;
    width: 100%;
  }

  .quick-q {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }

  .quick-q:hover {
    border-color: var(--accent);
    background: var(--surface2);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(245,166,35,0.1);
  }

  .quick-q .q-icon { font-size: 20px; margin-bottom: 8px; }
  .quick-q .q-text { font-size: 13px; font-weight: 500; line-height: 1.4; }

  /* MESSAGES */
  .message {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    align-self: flex-start;
  }

  .bot-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .user-avatar { background: var(--surface2); border: 1px solid var(--border); }

  .msg-content { max-width: 72%; }

  .msg-bubble {
    padding: 14px 18px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .bot .msg-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .user .msg-bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0a0f;
    border-top-right-radius: 4px;
    font-weight: 500;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 5px;
    padding: 0 4px;
  }

  .message.user .msg-time { text-align: right; }

  /* TYPING INDICATOR */
  .typing-indicator {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    animation: msgIn 0.3s ease;
  }

  .typing-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 16px 20px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .typing-dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* INPUT BAR */
  .input-bar {
    position: relative;
    z-index: 10;
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #user-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    resize: none;
    min-height: 50px;
    max-height: 120px;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.5;
  }

  #user-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--gold-glow);
  }

  #user-input::placeholder { color: var(--text-dim); }

  #send-btn {
    width: 50px; height: 50px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    flex-shrink: 0;
  }

  #send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px rgba(245,166,35,0.4); }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .char-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 24px 10px;
    background: var(--surface);
    flex-shrink: 0;
  }

  /* Error message */
  .error-bubble .msg-bubble {
    background: rgba(248,113,113,0.1);
    border-color: rgba(248,113,113,0.3);
    color: var(--error);
  }
</style>
</head>
<body>


<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="header-icon">🏢</div>
    <div>
      <div class="header-title">SriVarma Properties</div>
      <div class="header-sub">Agent Training Bot</div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-selector">
      <button class="lang-btn active" onclick="setLang('English', this)">EN</button>
      <button class="lang-btn" onclick="setLang('Telugu', this)">తె</button>
      <button class="lang-btn" onclick="setLang('Bilingual', this)">Both</button>
    </div>
    <button class="reset-btn" onclick="resetChat()">↺ Reset</button>
    <div class="status-dot" title="Online"></div>
  </div>
</header>

<!-- CHAT AREA -->
<div id="chat-area">
  <div class="welcome-screen" id="welcome-screen">
    <div class="welcome-badge">✦ AI-Powered Training Assistant</div>
    <h1>What do you want<br>to learn today?</h1>
    <p>Ask anything about plot pricing, documents, booking process, commissions, or agent guidelines.</p>
    <div class="quick-questions">
      <button class="quick-q" onclick="sendQuick('What documents are required from the buyer?')">
        <div class="q-icon">📄</div>
        <div class="q-text">Documents required from buyer</div>
      </button>
      <button class="quick-q" onclick="sendQuick('What is the agent commission structure?')">
        <div class="q-icon">💰</div>
        <div class="q-text">Agent commission & bonuses</div>
      </button>
      <button class="quick-q" onclick="sendQuick('How does the site visit process work?')">
        <div class="q-icon">📍</div>
        <div class="q-text">Site visit process steps</div>
      </button>
      <button class="quick-q" onclick="sendQuick('What are the plot prices and zones?')">
        <div class="q-icon">🗺️</div>
        <div class="q-text">Plot pricing by zone</div>
      </button>
      <button class="quick-q" onclick="sendQuick('What should agents never do?')">
        <div class="q-icon">⚠️</div>
        <div class="q-text">Agent do\'s and don\'ts</div>
      </button>
      <button class="quick-q" onclick="sendQuick('How to handle customer objections about loan?')">
        <div class="q-icon">🤝</div>
        <div class="q-text">Handling objections</div>
      </button>
    </div>
  </div>
  <div id="messages"></div>
</div>

<div class="input-bar">
  <textarea id="user-input" placeholder="Ask about plots, documents, commissions..." rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>
<div class="char-hint">Press Enter to send · Shift+Enter for new line</div>

<script>
  let currentLanguage = 'English';
  let isWaiting = false;



  function showErr(msg) {
    const err = document.getElementById('setup-error');
    err.textContent = msg;
    err.style.display = 'block';
  }

  function setLang(lang, btn) {
    currentLanguage = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function getTime() {
    return new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  }

  function hideWelcome() {
    const w = document.getElementById('welcome-screen');
    if (w) { w.style.display = 'none'; }
  }

  function addMessage(text, role, isError=false) {
    hideWelcome();
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}${isError ? ' error-bubble' : ''}`;

    const avatar = role === 'bot' ? '🤖' : '👤';
    const avatarClass = role === 'bot' ? 'bot-avatar' : 'user-avatar';

    div.innerHTML = `
      <div class="msg-avatar ${avatarClass}">${avatar}</div>
      <div class="msg-content">
        <div class="msg-bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${getTime()}</div>
      </div>`;

    msgs.appendChild(div);
    scrollToBottom();
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing';
    div.innerHTML = `
      <div class="msg-avatar bot-avatar">🤖</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    msgs.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollToBottom() {
    const area = document.getElementById('chat-area');
    area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    if (isWaiting) return;
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    autoResize(input);

    isWaiting = true;
    document.getElementById('send-btn').disabled = true;
    showTyping();

    fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, language: currentLanguage})
    })
    .then(r => r.json())
    .then(data => {
      hideTyping();
      if (data.success) {
        addMessage(data.response, 'bot');
      } else {
        addMessage(data.error || 'Something went wrong. Try again.', 'bot', true);
      }
    })
    .catch(() => {
      hideTyping();
      addMessage('Connection error. Please check the server.', 'bot', true);
    })
    .finally(() => {
      isWaiting = false;
      document.getElementById('send-btn').disabled = false;
    });
  }

  function sendQuick(text) {
    document.getElementById('user-input').value = text;
    sendMessage();
  }

  function resetChat() {
    fetch('/reset', {method: 'POST'});
    document.getElementById('messages').innerHTML = '';
    const w = document.getElementById('welcome-screen');
    if (w) w.style.display = 'flex';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // Fade out animation
  const style = document.createElement('style');
  style.textContent = '@keyframes fadeOut { to { opacity: 0; } }';
  document.head.appendChild(style);
</script>
</body>
</html>
